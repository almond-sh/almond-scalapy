name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - run: ./mill -i __.compile + __.mimaReportBinaryIssues + __.publishLocal

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - run: ./mill -i examples.test

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: scalafmt
    - run: scalafmt --check
