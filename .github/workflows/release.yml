name: Release
on:
  push:
    branches:
    - main
    tags:
    - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # Never run two SonatypeCentralPublishModule uploads at the same time
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      # For the GitHub Packages upload
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - name: Publish to Sonatype Central
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "almond-scalapy-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          # Publish a snapshot, even if HEAD is tagged too (its release is published by the tag push)
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      shell: bash
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    # Same artifacts, snapshots included, to the GitHub Packages Maven repository of this repo.
    # Best effort: Sonatype Central is the source of truth, so a failure here shouldn't fail the job.
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      shell: bash
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
