[project]
name = "almond-scalapy-examples"
version = "0.0.0"
description = "Jupyter environment used to run the almond-scalapy example notebooks"
requires-python = ">=3.10"
dependencies = [
  # the notebooks use the Python of this environment via ScalaPy, and display IPython objects
  "ipython>=8",
  "jupyter-client>=8",
  "nbconvert>=7.17",
]

[tool.uv]
package = false
